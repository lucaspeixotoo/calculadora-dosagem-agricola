name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preparar:
    name: Versão e pacote
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      release: ${{ steps.versao.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verificar se existe Release publicada
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName')
          if [ -z "$releases" ]; then
            echo "primeira=true" >> "$GITHUB_OUTPUT"
          else
            echo "primeira=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calcular próxima versão (Conventional Commits)
        id: versao
        env:
          NOTAS_ARQUIVO: notas-release.md
          PRIMEIRA_RELEASE: ${{ steps.baseline.outputs.primeira }}
        run: node scripts/proxima-versao.mjs

      - name: Empacotar (código-fonte da API Express)
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          mkdir pacote
          git archive HEAD | tar -x -C pacote
          echo "$VERSAO" > pacote/VERSAO

      - name: Compactar pacote
        env:
          NOME: ${{ github.event.repository.name }}-${{ steps.versao.outputs.versao }}
        run: |
          test -d pacote || { echo "::error::A pasta pacote/ não foi criada pelo trecho da sua stack."; exit 1; }
          (cd pacote && zip -qr "../$NOME.zip" .)
          echo "Pacote gerado: $NOME.zip"

      - name: Guardar pacote (o MESMO vai para staging e produção)
        uses: actions/upload-artifact@v4
        with:
          name: pacote
          path: |
            *.zip
            notas-release.md
          retention-days: 30

  staging:
    name: Staging
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pacote

      - name: Extrair pacote
        run: mkdir site && unzip -q ./*.zip -d site

      - name: Resumo
        env:
          VERSAO: ${{ needs.preparar.outputs.versao }}
          RELEASE: ${{ needs.preparar.outputs.release }}
        run: |
          {
            echo "## Staging — v$VERSAO"
            echo "- Pacote candidato: seção **Artifacts** desta execução (arquivo \`pacote\`)."
            if [ "$RELEASE" = "true" ]; then
              echo "- Teste o pacote e aprove o job **Produção** para criar a baseline v$VERSAO."
            else
              echo "- Sem commit feat/fix desde a última tag: não haverá release nova."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  producao:
    name: Produção
    needs: [preparar, staging]
    if: needs.preparar.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.preparar.outputs.versao }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: pacote
          path: entrega

      - name: Criar baseline — tag + Release com notas e pacote (PGC 9)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.preparar.outputs.versao }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::notice::Release $TAG já existe — nada a fazer."
              exit 0
            fi
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" || { echo "::error::Tag existente aponta para outro commit."; exit 1; }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          gh release create "$TAG" entrega/*.zip --title "$TAG" \
            --notes-file entrega/notas-release.md --verify-tag --latest
