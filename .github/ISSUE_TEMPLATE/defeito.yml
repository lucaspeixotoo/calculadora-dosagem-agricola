name: Defeito
description: Relate um erro encontrado
title: 'fix: '
labels: ['defeito']
body:
  - type: input
    id: versao
    attributes:
      label: Versão / ambiente
      description: 'Tag ou commit em que o erro aparece (ex.: v0.1.0)'
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado x obtido
    validations:
      required: true
